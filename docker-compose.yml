services:
  mysql:
    image: mysql:8.4
    container_name: senderwho-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: senderwho
      MYSQL_USER: senderwho
      MYSQL_PASSWORD: senderwho_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - senderwho_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:5
    container_name: senderwho-adminer
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  senderwho_mysql_data:
